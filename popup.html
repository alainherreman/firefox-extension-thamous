<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <title>Importer dans Thamous</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header class="thamous-bar">
        <div class="thamous-brand">
          <img class="thamous-logo" src="icons/icon-32.png" alt="Thamous">
          <span id="header-user-name" class="thamous-title">Thamous</span>
        </div>
        <button id="logout-button" type="button" class="icon-button hidden" title="Se déconnecter" aria-label="Se déconnecter">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M16 13v-2H7V8l-5 4 5 4v-3h9z" fill="currentColor"/>
            <path d="M20 3H12v2h8v14h-8v2h8c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z" fill="currentColor"/>
          </svg>
        </button>
      </header>

      <section id="login-view" class="view hidden">
        <p class="intro">Connectez-vous pour importer des références dans Thamous.</p>
        <label>
          <span>Login</span>
          <input id="login" type="text" autocomplete="username">
        </label>
        <label>
          <span>Mot de passe</span>
          <input id="password" type="password" autocomplete="current-password">
        </label>
        <button id="login-button" type="button" class="primary-button">Se connecter</button>
      </section>

      <section id="app-view" class="view hidden">
        <div id="llm-panel" class="llm-panel">
          <button id="llm-status-button" type="button" class="llm-status-button">
            <span id="llm-status" class="llm-status-text">LLM : vérification…</span>
          </button>
          <button id="choose-llm-button" type="button" class="secondary-button hidden">Choisir un modèle LLM</button>
        </div>
        <p class="actions-label">Importer :</p>
        <div class="actions">
          <button id="import-main-button" type="button" class="primary-button">la référence principale</button>
          <button id="import-all-button" type="button" class="secondary-button">toutes les références</button>
          <button id="import-page-button" type="button" class="secondary-button">la page</button>
        </div>
      </section>

      <p id="status" class="status hidden" aria-live="polite"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
